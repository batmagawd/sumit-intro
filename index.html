<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SUMIT AGGARWAL | Intro</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="stars"></div>
<main class="card">
  <div class="sun">❄️</div>
  <div class="avatar-wrap">
    <div class="avatar"><img src="profile.jpg" alt="Sumit Aggarwal"></div>
    <span class="status">● online</span>
  </div>

  <h1>SUMIT</h1>
  <p class="username">✦ AGGARWAL ✦</p>
  <p class="tg">@iamIund</p>
  <div class="line"></div>
  <p class="quote">𓆩 कट्टर हिन्दू • सुमित 𓆪</p>

  <div class="tags">
    <span>CODER</span><span>GAMER</span><span>AGGARWAL</span><span>BUILDER</span>
  </div>

  <section class="player">
    <div class="disc" id="disc">♫</div>
    <div class="song">
      <b>MANAVE</b>
      <small>SUMIT • MUSIC</small>
      <div class="progress"><i id="bar"></i></div>
    </div>
    <button id="play">▶</button>
  </section>
  <p class="hint">Tap the button to play / pause</p>
  <audio id="audio" src="music.mp3" preload="metadata"></audio>
</main>
<script src="script.js"></script>
</body>
</html>
